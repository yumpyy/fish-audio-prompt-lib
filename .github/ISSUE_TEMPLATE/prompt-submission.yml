name: Submit a voice prompt
description: Add a voice prompt to the library. Drag your audio file into the form body.
title: "Prompt: "
labels: ["prompt-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## Submit a prompt

        Thanks for contributing to the Fish Audio Prompt Library.

        1. Attach your audio file (mp3/wav/ogg/m4a/flac) using the **Audio file** field below. You can also drag it anywhere into the form body.
        2. Fill in every required field below. Optional metadata (`speed` 0.7-1.3, `volume` -5..5, `temperature`/`top_p` 0.7, `repetition_penalty` 1.2, `voice_name`/`voice_url`) shows **N/A** when omitted. Supports multiline `prompt_text` (one `[emotion]` per line).
        3. Models available: `s2.1-pro` · `s2-pro` · `s1` · `drama-3` (all optional except title/model/language/tags/prompt).
        4. Submit. An automated pipeline will review it, upload your audio to the CDN, and open a pull request with your entry.

  - type: upload
    id: audio
    attributes:
      label: Audio file
      description: Drag your audio file (mp3/wav/ogg/m4a/flac) here.
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Prompt title
      description: Short, searchable name for this prompt, e.g. "Robotic Evil".
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: Model
      description: FishSpeech model used to generate/infer this prompt.
      options:
        - s2.1-pro
        - s2-pro
        - s1
        - drama-3
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language
      description: ISO 639-1 code, e.g. `en`, `zh`, `ja`.
      placeholder: en
    validations:
      required: true

  - type: input
    id: voice_name
    attributes:
      label: Voice name (optional)
      description: Display name of the Fish Audio voice, e.g. "Documentary Narrator Voice".
      placeholder: Documentary Narrator Voice

  - type: input
    id: voice_url
    attributes:
      label: Voice link (optional)
      description: Link to the Fish Audio voice, e.g. https://fish.audio/m/06363c7577df4390aea3e466224a542d
      placeholder: https://fish.audio/m/...

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated keywords, e.g. `robotic, evil, deep`.
      placeholder: robotic, evil
    validations:
      required: true

  - type: textarea
    id: prompt_text
    attributes:
      label: Prompt text
      description: The exact voice prompt.
      placeholder: |
        [calm][measured confidence] Here, in the fluorescent wilds...
        [curious] Watch as it approaches...
    validations:
      required: true

  - type: input
    id: speed
    attributes:
      label: Speed (optional)
      description: Playback speed. Range 0.7 to 1.3. Leave empty for default `1.0`.
      placeholder: "1.0"

  - type: input
    id: volume
    attributes:
      label: Volume (optional)
      description: Volume adjustment in dB. Range -5 to 5. Leave empty for default `0`.
      placeholder: "0"

  - type: input
    id: temperature
    attributes:
      label: Temperature (optional)
      description: Sampling parameter. Lower = more deterministic. Leave empty for default `0.7`.
      placeholder: "0.7"

  - type: input
    id: top_p
    attributes:
      label: Top P (optional)
      description: Sampling parameter. Leave empty for default `0.7`.
      placeholder: "0.7"

  - type: input
    id: repetition_penalty
    attributes:
      label: Repetition penalty (optional)
      description: ">1.0 curbs repeated sounds. Leave empty for default `1.2`."
      placeholder: "1.2"

  - type: dropdown
    id: nsfw
    attributes:
      label: NSFW (optional)
      description: Mark this prompt as 18+ content.
      options:
        - "No"
        - "Yes"

  - type: textarea
    id: description
    attributes:
      label: Notes / description (optional)
      description: Anything else to show on the prompt page.

  - type: input
    id: contributor
    attributes:
      label: Your name or handle
      description: Shown on the prompt page as the contributor.
    validations:
      required: true

  - type: checkboxes
    id: consent
    attributes:
      label: License / consent
      description: Required.
      options:
        - label: "I confirm this audio is generated by me, I have the rights to share it, and I license it for publication on this site under a permissive license."
          required: true
    validations:
      required: true