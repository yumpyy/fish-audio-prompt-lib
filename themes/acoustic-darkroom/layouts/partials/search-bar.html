<!-- Search Section -->
<div class="max-w-2xl mx-auto mb-12 flex flex-col items-center gap-4">
  <div id="search-wrap" class="group/input relative w-full rounded-full p-[1px] transition duration-300" style="background: rgba(255,255,255,0.06)">
    <div class="relative w-full">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-icon lucide-search absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 pointer-events-none z-10"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search-input" type="text" class="w-full border-none bg-[#0a0a0a] rounded-full py-3 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/30 focus-visible:outline-none focus-visible:ring-0 focus-visible:ring-offset-0 disabled:cursor-not-allowed disabled:opacity-50 transition duration-200" placeholder="Search &quot;kawaii neko girl&quot; · #tag · @model · voice:Documentary · lang:japanese" autocomplete="off"/>
    </div>
  </div>

  <!-- Suggestions (populated by JS while typing) -->
  <div id="search-suggestions" class="hidden flex flex-wrap justify-center items-center gap-2 w-full"></div>

  <!-- Active filters (populated by JS) -->
  <div id="active-filters" class="hidden flex flex-wrap justify-center items-center gap-2 w-full"></div>

  <div class="flex flex-wrap justify-center gap-2">
    <span class="text-label-mono text-[10px] text-on-surface-variant uppercase tracking-widest mr-2 self-center">Quick:</span>
    {{ $popularTags := slice "happy" "crying" "whisper" "laughing" "shouting" "calm" "angry" "sad" }}
    {{ range first 5 $popularTags }}
      <button class="filter-chip px-3 py-1 rounded-full border border-white/[12%] text-label-mono text-[11px] text-gray-400 hover:border-primary/40 hover:text-white hover:bg-white/[7%] transition-all duration-300" data-filter="tag:{{ . }}">{{ . | title }}</button>
    {{ end }}
    <button class="filter-chip px-3 py-1 rounded-full border border-red-500/30 text-label-mono text-[11px] text-red-400/70 hover:border-red-400 hover:text-red-300 hover:bg-red-500/10 transition-all duration-300" data-filter="nsfw:true">18+</button>
  </div>

  <!-- Model Filter — only s2.1-pro, s2-pro, s1, drama-3 -->
  <div class="flex flex-wrap justify-center gap-2">
    <span class="text-label-mono text-[10px] text-on-surface-variant uppercase tracking-widest mr-2 self-center">Model:</span>
    {{ $models := slice "s2.1-pro" "s2-pro" "s1" "drama-3" }}
    {{ range $models }}
      <button class="filter-chip px-3 py-1 rounded-full border border-white/[12%] text-label-mono text-[11px] text-gray-400 hover:border-primary/40 hover:text-white hover:bg-white/[7%] transition-all duration-300" data-filter="model:{{ . }}">{{ . }}</button>
    {{ end }}
  </div>
</div>
